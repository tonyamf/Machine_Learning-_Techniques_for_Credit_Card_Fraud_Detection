name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (notebook-only packages skipped)
        run: |
          pip install $(grep -E '^[a-z]' requirements.txt | grep -vE 'jupyter|nbconvert|ipykernel') pytest
      - name: Run tests
        run: python -m pytest -v
